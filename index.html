<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Ubåtsjakten - Defend Sweden from Russian submarines. Fire bullets, unleash Zlatan, and survive three hits. Play now in your browser." />
    <meta name="theme-color" content="#1a1a2e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ubatsjakten.borrowed.computer/" />
    <meta property="og:title" content="Ubåtsjakten" />
    <meta property="og:description" content="A retro arcade game where you defend Sweden from Russian submarines. Shoot, survive, and use Zlatan's power to clear the board." />
    <meta property="og:image" content="/assets/sprites/kungen.png" />
    <meta property="og:image:width" content="200" />
    <meta property="og:image:height" content="200" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary" />
    <meta property="twitter:url" content="https://ubatsjakten.borrowed.computer/" />
    <meta property="twitter:title" content="Ubåtsjakten" />
    <meta property="twitter:description" content="Play Ubåtsjakten - Defend Sweden from submarines in this retro arcade shooter." />
    <meta property="twitter:image" content="/assets/sprites/kungen.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/favicon.ico" />

    <title>Ubåtsjakten</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        width: 100%;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #000;
        font-family: Arial, sans-serif;
        overflow: hidden;
      }

      #gameCanvas {
        display: block;
        background: #1a1a2e;
        cursor: crosshair;
      }

      #info {
        position: absolute;
        bottom: 20px;
        left: 20px;
        color: #fff;
        font-size: 14px;
        background: rgba(0, 0, 0, 0.5);
        padding: 10px;
        border-radius: 4px;
        z-index: 10;
      }
    </style>
  </head>
  <body>
    <canvas id="gameCanvas"></canvas>
    <div id="info">
      <p>↑/↓ Move | SPACE Shoot | ESC Pause</p>
    </div>
    <script type="module" src="/dist/index.js"></script>
  </body>
</html>
