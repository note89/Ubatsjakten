<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ubåtsjakten</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        width: 100%;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #000;
        font-family: Arial, sans-serif;
        overflow: hidden;
      }

      #gameCanvas {
        display: block;
        background: #1a1a2e;
        cursor: crosshair;
      }

      #info {
        position: absolute;
        top: 10px;
        right: 10px;
        color: #fff;
        font-size: 14px;
        background: rgba(0, 0, 0, 0.5);
        padding: 10px;
        border-radius: 4px;
        z-index: 10;
      }
    </style>
  </head>
  <body>
    <canvas id="gameCanvas"></canvas>
    <div id="info">
      <p>↑/↓ Move | SPACE Shoot | ESC Pause</p>
    </div>
    <script type="module" src="/dist/index.js"></script>
  </body>
</html>
